<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!--
    The Diary feature's web host (ios/Fractonica/Features/Diary). DiaryWebEngine serves this page and the bundle's web/
    copy of the web app (fractonica.js, src/…) under fxdiary://app/. diary-host.js plans the book with the web app's own
    modules and shows its pages; the native side drives it through window.fxDiary and hears back through
    webkit.messageHandlers.diary.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Diary</title>
  <style>
    :root { --pw: 0px; --ph: 0px; --pad-t: 12px; --pad-b: 12px; --pad-x: 16px; }
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: transparent;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; font: 13px -apple-system, system-ui, sans-serif;
    }
    #track {
      position: fixed; inset: 0; display: flex; overflow-x: auto; overflow-y: hidden;
      scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain;
      outline: none;
    }
    #track::-webkit-scrollbar { display: none; }
    .slot {
      flex: 0 0 100%; height: 100%; box-sizing: border-box;
      padding: var(--pad-t) var(--pad-x) var(--pad-b);
      display: flex; align-items: center; justify-content: center;
      scroll-snap-align: center; scroll-snap-stop: always;
    }
    .leaf { display: flex; filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .5)) drop-shadow(0 1px 2px rgba(0, 0, 0, .45)); }
    .paper {
      width: var(--pw); height: var(--ph); background: #fff; position: relative; overflow: hidden;
      border-radius: 3px; cursor: zoom-in;
    }
    .paper.gap { background: transparent; cursor: default; }
    .leaf.two .paper:first-child { border-radius: 3px 0 0 3px; }
    .leaf.two .paper:last-child { border-radius: 0 3px 3px 0; }
    /* the fold of an open book: a soft shade on both sides of the spine */
    .leaf.two .paper:not(.gap)::after {
      content: ''; position: absolute; top: 0; bottom: 0; width: 7%; pointer-events: none;
    }
    .leaf.two .paper:first-child::after { right: 0; background: linear-gradient(to left, rgba(0, 0, 0, .14), rgba(0, 0, 0, 0)); }
    .leaf.two .paper:last-child::after { left: 0; background: linear-gradient(to right, rgba(0, 0, 0, .14), rgba(0, 0, 0, 0)); }
    .paper > svg { display: block; width: 100%; height: 100%; }
    /* a page not drawn yet: faint rules, so a fast swipe never shows an empty sheet */
    .paper.blank:not(.gap) {
      background: #fff repeating-linear-gradient(to bottom, transparent 0, transparent 13px, #eef0f2 13px, #eef0f2 14px);
      background-clip: content-box; padding: 9% 8%; box-sizing: border-box;
      background-color: #fff;
    }
    .paper.shown:not(.gap)::before {
      content: ''; position: absolute; z-index: 2; right: 6px; top: 6px; width: 7px; height: 7px; border-radius: 50%;
      background: #ff5d73; box-shadow: 0 0 0 2px rgba(255, 255, 255, .9);
    }
  </style>
  <script src="web/fractonica.js"></script>
  <script type="module" src="diary-host.js"></script>
</head>
<body>
  <div id="track" tabindex="0" role="group" aria-roledescription="pages" aria-label="Diary pages"></div>
</body>
</html>
