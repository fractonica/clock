[project]
name = "fx-worker"
version = "0.1.0"
description = "Fractonica Hub embedding worker (google/embeddinggemma-2)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5.18",
    "sentence-transformers>=6.1.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "pillow-heif>=1.0",
    "httpx>=0.28",
]

[project.scripts]
fx-worker = "fx_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fx_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the embedding model (slow)"]
