<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Fractonica Hub</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-3 -3 6 12'%3E%3Cg fill='none' stroke='%234FD1C5' stroke-width='.5' stroke-linecap='round'%3E%3Cpath d='M0 0V6M0 0C0 0 0 1 1 1C2 1 2 0 2 0M-1 3H1'/%3E%3C/g%3E%3C/svg%3E">
  <script>
    // theme before first paint: "auto" follows the system
    (function () {
      var pref = 'auto';
      try { pref = localStorage.getItem('fxhub.theme') || 'auto'; } catch (e) {}
      var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="stylesheet" href="/style.css">
  <script src="/fx/fractonica.js"></script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top" id="top" hidden>
    <div class="top-in">
      <a class="brand" href="#/" aria-label="Fractonica Hub">
        <svg viewBox="-3 -3 6 12" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width=".42" stroke-linecap="round"><path d="M0 0V9M0 0C0 0 0 1 1 1C2 1 2 0 2 0M0 3C0 3 0 2 -1 2C-2 2 -2 3 -2 3M-1 6H1"/></g></svg>
        <span class="brand-t"><b>Fractonica</b><small>Hub</small></span>
      </a>
      <div class="now" id="now" title="Now">
        <span class="now-clock mono" id="now-clock">—</span>
        <span class="now-sub" id="now-sub"></span>
      </div>
      <form class="search" id="search" role="search" autocomplete="off">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search everything…" aria-label="Search" enterkeyhint="search">
      </form>
      <nav class="nav" aria-label="Views">
        <a href="#/" id="nav-timeline"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/></svg><span>Timeline</span></a>
        <a href="#/devices" id="nav-devices"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="13" height="10" rx="2"/><rect x="15" y="9" width="6" height="11" rx="1.5"/><path d="M6 18h7"/></svg><span>Devices</span></a>
      </nav>
      <div class="tools">
        <span class="status" id="status" title="Embedding worker"><i class="dot" id="worker-dot"></i><span id="worker-text">worker</span></span>
        <button class="btn icon ghost" id="theme" title="Theme" aria-label="Theme"></button>
      </div>
    </div>
  </header>
  <main id="main"></main>
  <dialog id="dlg"></dialog>
</body>
</html>
